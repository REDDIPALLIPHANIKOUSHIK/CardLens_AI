name: CardLens CI
on:
  push:
  pull_request:
jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: cardlens
          POSTGRES_USER: cardlens
          POSTGRES_PASSWORD: cardlens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cardlens -d cardlens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://cardlens:cardlens@localhost:5432/cardlens
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements-dev.txt
      - run: alembic -c backend/alembic.ini upgrade head
      - run: python scripts/seed_database.py
      - run: pytest -q backend/tests
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f backend/Dockerfile -t cardlens-api:ci .
      - name: Build frontend image
        run: docker build -t cardlens-web:ci ./frontend
